<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Al-Qur'an — القرآن </title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="source/styles.css">
</head>

<body class="theme-dark">
  <div id="viewer" aria-live="polite" tabindex="0">
    <img id="pageImg" alt="Quran page" src="" />
  </div>

  <!-- Settings Panel toggled by pressing 'O' -->
  <div id="settingsOverlay" aria-hidden="true">
    <div id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsHeading">
      <h3 id="settingsHeading">Settings</h3>
      <div class="section">
        <div style="margin-bottom:8px;font-size:13px;color:var(--muted-text);">Theme</div>
        <div class="theme-section">
          <button class="theme-sample sample-dark" id="btnDark" aria-pressed="false">
            <img src="assets/sample_dark.png" alt="Dark sample" />
          </button>
          <button class="theme-sample sample-sunset" id="btnSunset" aria-pressed="false">
            <img src="assets/sample_sunset.png" alt="Sunset sample" />
          </button>
        </div>
        <div class="theme-labels">
          <div>Dark</div>
          <div>Sunset</div>
        </div>
      </div>
      <div class="section">
        <div style="margin-bottom:8px;font-size:13px;color:var(--muted-text);">Quality</div>
        <div class="theme-section">
          <button class="theme-sample sample-dark" id="btnQualityDefault" aria-pressed="false">
            <img src="assets/sample_default.png" />
          </button>
          <button class="theme-sample sample-sunset" id="btnQuality2k" aria-pressed="false">
            <img src="assets/sample_2k.png" />
          </button>
        </div>
        <div class="theme-labels">
          <div>Default</div>
          <div>2K</div>
        </div>
      </div>
    </div>
  </div>

  <div id="audioOverlay" aria-hidden="true">
    <div id="audioPanel" role="dialog" aria-modal="true" aria-labelledby="audioHeading">
      <h3 id="audioHeading" class="sura-heading">Surah</h3>
      <p class="audio-sub"><i data-feather="mic" style="width: 12px; padding-right: 4px;"></i>Mishary Rashid Alafasy</p>
      <div class="reciter">
        <div class="audio-verse-label" id="audioVerseLabel">Verse 1</div>
        <img
          src="https://quran.com/_next/image?url=https%3A%2F%2Fstatic.qurancdn.com%2Fimages%2Freciters%2F6%2Fmishary-rashid-alafasy-profile.jpeg%3Fv%3D1&w=1920&q=75"
          class="reciter-img">
      </div>
      <div class="audio-controls">
        <button id="audioPrev" class="icon-btn" title="Previous"><svg xmlns="http://www.w3.org/2000/svg" width="16"
            height="16" fill="currentColor" class="bi bi-skip-backward-fill" viewBox="0 0 16 16">
            <path
              d="M.5 3.5A.5.5 0 0 0 0 4v8a.5.5 0 0 0 1 0V8.753l6.267 3.636c.54.313 1.233-.066 1.233-.697v-2.94l6.267 3.636c.54.314 1.233-.065 1.233-.696V4.308c0-.63-.693-1.01-1.233-.696L8.5 7.248v-2.94c0-.63-.692-1.01-1.233-.696L1 7.248V4a.5.5 0 0 0-.5-.5" />
          </svg></button>
        <button id="audioPlayPause" class="icon-btn" title="Play/Pause"><svg xmlns="http://www.w3.org/2000/svg"
            width="16" height="16" fill="currentColor" class="bi bi-pause-fill" viewBox="0 0 16 16">
            <path
              d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5" />
          </svg></button>
        <button id="audioNext" class="icon-btn" title="Next"><svg xmlns="http://www.w3.org/2000/svg" width="16"
            height="16" fill="currentColor" class="bi bi-skip-forward-fill" viewBox="0 0 16 16">
            <path
              d="M15.5 3.5a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V8.753l-6.267 3.636c-.54.313-1.233-.066-1.233-.697v-2.94l-6.267 3.636C.693 12.703 0 12.324 0 11.693V4.308c0-.63.693-1.01 1.233-.696L7.5 7.248v-2.94c0-.63.693-1.01 1.233-.696L15 7.248V4a.5.5 0 0 1 .5-.5" />
          </svg></button>
      </div>
    </div>
  </div>

  <!-- Navigation Panel toggled by pressing 'N' -->
  <div id="navOverlay" aria-hidden="true">
    <div id="navPanel" role="dialog" aria-modal="true">
      <h3 id="navHeading">Navigation</h3>
      <p id="navSub" style="margin-top:-5px;margin-bottom:6px;font-size:13px;color:var(--muted-text-2);">Navigate the
        Holy Qur'an</p>

      <!-- tabs -->
      <div class="nav-tabs" style="display:flex;gap:8px;margin-bottom:8px;">
        <button id="tabSurah" class="nav-tab" type="button" aria-pressed="true">Surah</button>
        <button id="tabJuz" class="nav-tab" type="button" aria-pressed="false">Juz'</button>
        <button id="tabPage" class="nav-tab" type="button" aria-pressed="false">Page</button>
      </div>

      <div style="margin-top:4px;">
        <input id="navSearch" type="search" placeholder="Try typing Ya-Sin or 36 ..." />
      </div>

      <div id="navList" class="nav-list" role="region" aria-live="polite" tabindex="0">
        <!-- Surah buttons rendered by script.js -->
      </div>
    </div>
  </div>

  <!-- Bookmarks Panel toggled by pressing 'B' -->
  <div id="bmOverlay" aria-hidden="true">
    <div id="bmPanel" role="dialog" aria-modal="true" aria-labelledby="bmHeading">
      <div class="bm-header">
        <div>
          <h3 id="bmHeading">Bookmarks</h3>
          <p class="bm-sub">Save pages & track progress</p>
        </div>
        <div class="bm-actions">
          <!-- Add bookmark button -->
          <button id="bmAddBtn" class="icon-btn" title="Add bookmark" aria-label="Add bookmark">
            <i data-feather="bookmark"></i>
          </button>

          <!-- Trash / Toggle to checkmark -->
          <button id="bmTrashBtn" class="icon-btn" title="Delete bookmarks" aria-label="Delete bookmarks">
            <i data-feather="trash-2"></i>
          </button>
        </div>
      </div>

      <div id="bmList" class="bm-list nav-list" style="margin-top: 5px;" role="region" aria-live="polite" tabindex="0">
        <!-- Bookmark items rendered by script.js -->
      </div>
    </div>
  </div>

  <!-- Bookmark naming prompt overlay (blur background) -->
  <div id="bmPromptOverlay" aria-hidden="true">
    <div id="bmPrompt">
      <h4>Save a bookmark</h4>
      <input id="bmNameInput" type="text" placeholder="e.g. Currently learning" maxlength="80" />
      <div class="bmPromptActions">
        <button id="bmPromptCancel">Cancel</button>
        <button id="bmPromptSave">Save</button>
      </div>
    </div>
  </div>

  <div id="rightSidebar" aria-hidden="false">
    <div class="side-top">
      <button id="sideBtnToggle" class="side-btn" title="Toggle sidebar [.]" aria-label="Toggle sidebar">
        <i data-feather="sidebar"></i>
      </button>
      <hr width="60%" style="border-color: var(--border); opacity: 0.6;">
      <button id="sideBtnSettings" class="side-btn" title="Settings [O]" aria-label="Open settings">
        <i data-feather="settings"></i>
      </button>
      <button id="sideBtnNav" class="side-btn" title="Navigation [N]" aria-label="Open navigation">
        <i data-feather="menu"></i>
      </button>
      <button id="sideBtnBookmarks" class="side-btn" title="Bookmarks [B]" aria-label="Open bookmarks">
        <i data-feather="bookmark"></i>
      </button>
    </div>
  </div>

  <script src="source/script.js"></script>
  <script>
    feather.replace();
  </script>
</body>

</html>
